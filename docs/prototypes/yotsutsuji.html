<style>
/* Layout: one column play surface — stage header, board card with side circle gutters, three-button tray, rules underneath */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --cell: #e4e7ee;
  --peg: #bcc1cc;
  --ink: #22252d;
  --muted: #6a7080;
  --line: #d5d9e2;
  --c0: #e0464e; --c1: #3a5fe0; --c2: #35a542; --c3: #e3a10f; --c4: #b04fc8; --c5: #17a6cf;
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --surface: #1d2027; --cell: #2a2e37; --peg: #555b68; --ink: #e9ebf1; --muted: #9ba1ae; --line: #343944;
    --c0: #f2646b; --c1: #6f8cf7; --c2: #52c25e; --c3: #f2b63c; --c4: #cd7be3; --c5: #3cc3ea;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --surface: #1d2027; --cell: #2a2e37; --peg: #555b68; --ink: #e9ebf1; --muted: #9ba1ae; --line: #343944;
  --c0: #f2646b; --c1: #6f8cf7; --c2: #52c25e; --c3: #f2b63c; --c4: #cd7be3; --c5: #3cc3ea;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 500;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

}

}

.status { display: flex; justify-content: center; gap: 18px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.rules li::marker { color: var(--peg); }
.overlay {
  position: absolute; inset: 0; border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);

.dots span:nth-child(3) { background: var(--c2); animation-delay: 0.3s; }
@keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {

<script id="engine">
// ===== Puzzle engine v2: crossings (bridges) + generator + solver =====
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(a, rand) {
  for (let i = a.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function stageParams(s) {
  let n, k;
  if (s <= 3) { n = 4; k = 2; }
  else if (s <= 10) { n = 5; k = 2; }
  else if (s <= 20) { n = 5; k = 3; }
  else if (s <= 35) { n = 6; k = 3; }
  else if (s <= 55) { n = 6; k = 4; }
  else if (s <= 80) { n = 7; k = 4; }
  else if (s <= 110) { n = 7; k = 5; }
  else if (s <= 150) { n = 8; k = 5; }
  else { n = 8; k = 6; }
  let b = 0;
  if (s <= 20) b = 1;
  else if (s > 20 && s <= 55) b = s % 2 === 0 ? 2 : 1;
  else if (s > 55) b = s % 2 === 0 ? 3 : 2;
  const extra = Math.max(0, 0.3 - (s - 1) * 0.005);
  return { n, k, b, extra };
}

// Lane graph: every cell is a node; a bridge cell's node is its horizontal lane,
// and an extra node N+i is its vertical lane.
function buildLaneGraph(n, bridges) {
  const N = n * n, B = bridges.length, M = N + B;
  const bidx = new Int32Array(N).fill(-1);
  bridges.forEach((x, i) => { bidx[x] = i; });
  const cellOf = new Int32Array(M), other = new Int32Array(M).fill(-1), isV = new Uint8Array(M);
  for (let i = 0; i < N; i++) cellOf[i] = i;
  bridges.forEach((x, i) => { cellOf[N + i] = x; other[x] = N + i; other[N + i] = x; isV[N + i] = 1; });
  const nodeFor = (y, horizontal) => (bidx[y] >= 0 && !horizontal ? N + bidx[y] : y);
  const nb = [];
  for (let v = 0; v < M; v++) {
    const x = cellOf[v], r = (x / n) | 0, c = x % n, a = [];
    const br = bidx[x] >= 0;
    const allowH = !br || !isV[v], allowV = !br || isV[v] === 1;
    if (allowV) { if (r > 0) a.push(nodeFor(x - n, false)); if (r < n - 1) a.push(nodeFor(x + n, false)); }
    if (allowH) { if (c > 0) a.push(nodeFor(x - 1, true)); if (c < n - 1) a.push(nodeFor(x + 1, true)); }
    nb.push(a);
  }
  return { n, N, M, nb, cellOf, other, bidx };
}

// Generic search. mode 'gen': random order, return first full cover.
// mode 'diff': deterministic, return first full cover whose node assignment differs from intended.
function search(G, k, starts, ends, cp, opt) {
  const { M, nb, other } = G;
  const isRE = new Uint8Array(M); for (const e of ends) isRE[e] = 1;
  const occ = new Int8Array(M).fill(-1);
  const heads = new Int32Array(k), done = new Uint8Array(k), need = new Int32Array(k);
  for (let v = 0; v < M; v++) if (cp[v] >= 0) need[cp[v]]++;
  const pathNodes = [];
  for (let c = 0; c < k; c++) {
    occ[starts[c]] = c; heads[c] = starts[c];
    if (cp[starts[c]] === c) need[c]--;
    pathNodes.push([starts[c]]);
  }
  const gen = opt.mode === 'gen', rand = opt.rand, limit = opt.limit, intended = opt.intended;
  const headMark = new Int32Array(M), seen = new Int32Array(M), queue = new Int32Array(M);
  let st = 0, nodes = 0, hit = false, result = null;

  function canColorEnter(c, x) {
    const ct = cp[x];
    if (ct >= 0 && ct !== c) return false;
    const o = other[x];
    if (o >= 0 && occ[o] === c) return false;
    return true;
  }
  function valid(c, t) {
    if (occ[t] >= 0) return false;
    if (!canColorEnter(c, t)) return false;
    if (isRE[t] && need[c] - (cp[t] === c ? 1 : 0) !== 0) return false;
    return true;
  }
  function prune() {
    st++;
    for (let c = 0; c < k; c++) if (!done[c]) headMark[heads[c]] = st;
    for (let x = 0; x < M; x++) {
      if (occ[x] >= 0) continue;
      let emp = 0, hd = 0;
      const ns = nb[x];
      for (let q = 0; q < ns.length; q++) {
        const y = ns[q];
        if (occ[y] < 0) emp++;
        else if (headMark[y] === st && canColorEnter(occ[y], x)) hd++;
      }
      if (isRE[x]) { if (emp + hd < 1) return false; }
      else if (emp < 1 || emp + hd < 2) return false;
    }
    st++;
    for (let x = 0; x < M; x++) {
      if (occ[x] >= 0 || seen[x] === st) continue;
      let qh = 0, qt = 0; queue[qt++] = x; seen[x] = st;
      let re = 0, hmask = 0, cmask = 0;
      while (qh < qt) {
        const v = queue[qh++];
        if (isRE[v]) re++;
        if (cp[v] >= 0) cmask |= 1 << cp[v];
        const ns = nb[v];
        for (let q = 0; q < ns.length; q++) {
          const y = ns[q];
          if (occ[y] < 0) { if (seen[y] !== st) { seen[y] = st; queue[qt++] = y; } }
          else { const c = occ[y]; if (!done[c] && heads[c] === y) hmask |= 1 << c; }
        }
      }
      if (re === 0 || hmask === 0) return false;
      let pc = 0, m = hmask; while (m) { pc += m & 1; m >>= 1; }
      if (pc < re) return false;
      if (cmask & ~hmask) return false;
    }
    return true;
  }
  function dfs(remaining) {
    if (++nodes > limit) { hit = true; return true; }
    if (remaining === 0) {
      for (let i = 0; i < M; i++) if (occ[i] < 0) return false;
      if (gen) { result = { occ: Array.from(occ), paths: pathNodes.map(p => p.slice()) }; return true; }
      for (let i = 0; i < M; i++) if (occ[i] !== intended[i]) { result = { occ: Array.from(occ) }; return true; }
      return false;
    }
    let best = -1, bestCnt = 99;
    for (let c = 0; c < k; c++) {
      if (done[c]) continue;
      let cnt = 0; const ns = nb[heads[c]];
      for (let q = 0; q < ns.length; q++) if (valid(c, ns[q])) cnt++;
      if (cnt === 0) return false;
      if (cnt < bestCnt || (gen && cnt === bestCnt && rand() < 0.5)) { bestCnt = cnt; best = c; if (cnt === 1 && !gen) break; }
    }
    const h = heads[best], ns = nb[h], list = [];
    for (let q = 0; q < ns.length; q++) if (valid(best, ns[q])) list.push(ns[q]);
    if (gen) shuffleArr(list, rand);
    for (const t of list) {
      occ[t] = best; heads[best] = t; pathNodes[best].push(t);
      const cpHit = cp[t] === best; if (cpHit) need[best]--;
      const fin = isRE[t] === 1; if (fin) done[best] = 1;
      let stop = false;
      if (prune()) stop = dfs(remaining - (fin ? 1 : 0));
      if (fin) done[best] = 0;
      if (cpHit) need[best]++;
      pathNodes[best].pop(); heads[best] = h; occ[t] = -1;
      if (stop) return true;
    }
    return false;
  }
  dfs(k);
  if (hit) return { status: 'limit', nodes };
  if (result) return Object.assign({ status: 'found', nodes }, result);
  return { status: 'none', nodes };
}

// No-crossing partition via random Hamiltonian path (backbite), cut into k left-to-right paths
function genPartition(n, k, rand) {
  const N = n * n, G = buildLaneGraph(n, []), nb = G.nb;
  const p = new Int32Array(N), pos = new Int32Array(N);
  let idx = 0;
  for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) p[idx++] = r * n + (r % 2 === 0 ? cc : n - 1 - cc);
  for (let i = 0; i < N; i++) pos[p[i]] = i;
  function rev(a, b) { while (a < b) { const x = p[a], y = p[b]; p[a] = y; p[b] = x; pos[y] = a; pos[x] = b; a++; b--; } }
  function step() {
    if (rand() < 0.5) rev(0, N - 1);
    const e = p[N - 1], ns = nb[e], t = ns[(rand() * ns.length) | 0];
    if (t === p[N - 2]) return;
    rev(pos[t] + 1, N - 1);
  }
  const minLen = Math.max(n, Math.floor(0.55 * N / k)), maxLen = Math.ceil(1.7 * N / k);
  const endCol = k % 2 === 1 ? n - 1 : 0;
  function findCuts() {
    if (p[0] % n !== 0) { if (p[N - 1] % n === 0) rev(0, N - 1); else return null; }
    if (p[N - 1] % n !== endCol) return null;
    const Rc = [], Lc = [];
    for (let j = 0; j < N - 1; j++) {
      const a = p[j] % n, b = p[j + 1] % n;
      if (a === n - 1 && b === n - 1) Rc.push(j); else if (a === 0 && b === 0) Lc.push(j);
    }
    const cuts = [];
    function bt(prev, seg) {
      if (seg === k - 1) { const len = N - 1 - prev; return len >= minLen && len <= maxLen; }
      const list = seg % 2 === 0 ? Rc : Lc;
      if (!list.length) return false;
      const off = (rand() * list.length) | 0;
      for (let q = 0; q < list.length; q++) {
        const j = list[(q + off) % list.length], len = j - prev;
        if (len < minLen || len > maxLen) continue;
        cuts.push(j); if (bt(j, seg + 1)) return true; cuts.pop();
      }
      return false;
    }
    return bt(-1, 0) ? cuts.slice() : null;
  }
  for (let i = 0; i < N * 40; i++) step();
  for (let tries = 0; tries < 400000; tries++) {
    step();
    const cuts = findCuts();
    if (cuts) {
      const paths = []; let s = 0;
      for (let q = 0; q < k; q++) {
        const e = q < k - 1 ? cuts[q] : N - 1;
        const seg = Array.from(p.slice(s, e + 1));
        if (seg[0] % n !== 0) seg.reverse();
        paths.push(seg); s = e + 1;
      }
      paths.sort((a, b) => a[0] - b[0]);
      return { G, bridges: [], nodePaths: paths };
    }
  }
  return null;
}

// Partition with crossings: random starts/ends/bridges, then a randomized search for a full cover
function genWithBridges(n, k, b, rand) {
  const N = n * n;
  const color = x => ((((x / n) | 0) + (x % n)) & 1);
  for (let attempt = 0; attempt < 400; attempt++) {
    const cand = [];
    for (let r = 1; r < n - 1; r++) for (let c = 1; c < n - 1; c++) cand.push(r * n + c);
    shuffleArr(cand, rand);
    const br = [];
    for (const x of cand) {
      if (br.length >= b) break;
      if (br.some(y => Math.abs(y - x) === n || (Math.abs(y - x) === 1 && ((y / n) | 0) === ((x / n) | 0)))) continue;
      br.push(x);
    }
    if (br.length < b) continue;
    const rows = []; for (let r = 0; r < n; r++) rows.push(r);
    const sRows = shuffleArr(rows.slice(), rand).slice(0, k).sort((a, c) => a - c);
    const eRows = shuffleArr(rows.slice(), rand).slice(0, k).sort((a, c) => a - c);
    const starts = sRows.map(r => r * n), ends = eRows.map(r => r * n + n - 1);
    let diff = 0;
    for (let x = 0; x < N; x++) diff += color(x) === 0 ? 1 : -1;
    for (const x of br) diff += color(x) === 0 ? 1 : -1;
    let ed = 0;
    for (const x of starts.concat(ends)) ed += color(x) === 0 ? 1 : -1;
    if (diff * 2 !== ed) continue;
    const G = buildLaneGraph(n, br);
    const cp = new Int8Array(G.M).fill(-1);
    const res = search(G, k, starts, ends, cp, { mode: 'gen', rand, limit: 6000 });
    if (res.status !== 'found') continue;
    const lens = res.paths.map(p => p.length);
    const avg = G.M / k;
    if (Math.min.apply(null, lens) < Math.max(n, 0.45 * avg)) continue;
    // the left-to-right order must change somewhere (otherwise the crossings add nothing)
    const endRowOf = res.paths.map(p => (G.cellOf[p[p.length - 1]] / n) | 0);
    let swapped = false;
    for (let i = 1; i < k; i++) if (endRowOf[i] < endRowOf[i - 1]) swapped = true;
    if (!swapped) continue;
    return { G, bridges: br, nodePaths: res.paths };
  }
  return null;
}

function generatePuzzle(stage) {
  const { n, k, b, extra } = stageParams(stage);
  const rand = mulberry32((stage * 2654435761) ^ 0x5bd1e995);
  const N = n * n;
  let part = null;
  while (!part) part = b > 0 ? genWithBridges(n, k, b, rand) : genPartition(n, k, rand);
  const { G, bridges, nodePaths } = part;
  const M = G.M;
  const starts = nodePaths.map(p => p[0]);
  const ends = nodePaths.map(p => p[p.length - 1]);
  const assign = new Int8Array(M);

    const tgt = pz.paths[target], cells = new Set(), lanes = {};
    tgt.forEach((x, i) => {
      if (bidx[x] >= 0) lanes[x] = Math.abs(tgt[i - 1] - x) === 1 ? 'H' : 'V';
      else cells.add(x);
    });
    lines = lines.map((ln, c) => {
      if (c === target) return tgt.slice();
      for (let i = 0; i < ln.length; i++) {
        const x = ln[i];
        const clash = bidx[x] >= 0
          ? (lanes[x] && lanes[x] === (Math.abs(ln[i - 1] - x) === 1 ? 'H' : 'V'))
          : cells.has(x);
        if (clash) return ln.slice(0, i);
      }
      return ln;
    });
    animate({ type: 'flash', key: target, dur: 700 });
    animate({ type: 'pop', key: pz.ends.indexOf(tgt[tgt.length - 1]), dur: 320 });
    const O = occupancy();
    tgt.forEach(x => { if (bidx[x] >= 0 && O.oH[x] >= 0 && O.oV[x] >= 0) animate({ type: 'mix', key: x, dur: 450 }); });
    commit(before);
  });
  $('btn-next').addEventListener('click', function () { loadStage(stage + 1); });
  $('btn-list').addEventListener('click', showList);
  $('btn-back').addEventListener('click', function () { $('list-view').hidden = true; $('game-view').hidden = false; layout(); render(); });

  function showList() {
    const grid = $('stage-grid'); grid.textContent = '';
    const last = progress.maxCleared + 1;
    for (let s = 1; s <= last; s++) {
      const b = document.createElement('button');
      b.type = 'button'; b.id = 'stage-btn-' + s;
      if (s <= progress.maxCleared) b.classList.add('cleared');
      if (s === last) b.classList.add('next');
      const p = stageParams(s);
      b.innerHTML = '<span class="num">' + s + '</span><span class="sz">' + p.n + '×' + p.n + '</span>';
      b.setAttribute('aria-label', 'ステージ ' + s + (s <= progress.maxCleared ? ' クリア済み' : ''));
      b.addEventListener('click', function () { $('list-view').hidden = true; $('game-view').hidden = false; loadStage(s); });
      grid.appendChild(b);
    }
    $('game-view').hidden = true; $('list-view').hidden = false;
    const cur = $('stage-btn-' + stage); if (cur) cur.scrollIntoView({ block: 'center' });
  }

  // ---------- theme + resize ----------
  if (window.ResizeObserver) new ResizeObserver(function () { layout(); render(); }).observe($('board-wrap'));
  else window.addEventListener('resize', function () { layout(); render(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { render(); });
  new MutationObserver(function () { render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); render(); });

  // ---------- boot ----------
  const VERSION = 2;
  function start(data) {
    data = data || {};
    let s = data.stage || progress.current || 1;
    if (s > progress.maxCleared + 1) s = progress.maxCleared + 1;
    if (s < 1) s = 1;
    loadStage(s, data.v === VERSION && data.stage === s ? data.lines : null);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return { v: VERSION, stage: stage, lines: lines }; }); } catch (e) {} }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
